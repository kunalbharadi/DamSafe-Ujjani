services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: damsafe
      POSTGRES_USER: damsafe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-damsafe-local-development}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U damsafe -d damsafe"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: .
    environment: &environment
      DAMSAFE_DATABASE_URL: postgresql+psycopg://damsafe:${POSTGRES_PASSWORD:-damsafe-local-development}@db:5432/damsafe
      DAMSAFE_STORAGE_ROOT: /app/.local/objects
    depends_on:
      db: {condition: service_healthy}
    command: ["sh", "-c", "alembic upgrade head && python scripts/bootstrap.py"]
  api:
    build: .
    environment: *environment
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["objects:/app/.local/objects"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    build: .
    environment: *environment
    depends_on:
      migrate: {condition: service_completed_successfully}
    command: ["python", "-m", "damsafe.worker"]
volumes:
  postgres-data:
  objects:
